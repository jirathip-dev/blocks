about = "blocks-snap --check at 390 on every fixtures/stress variant: inside the width, over no sibling"
fix = "fix the view the check names so the variant fits its width and overlaps no sibling"
budget_secs = 900
leg = "apple"
paths = ["Package.swift", "swift/**", "schema/sample.json", "fixtures/**", ".gatekeeper/gates/swift-stress.toml"]
needs = ["quiet-host"]
run = """
set -e
export BLOCKS_STRICT=1
swift build --product blocks-snap
snap="$(swift build --show-bin-path)/blocks-snap"
for f in fixtures/stress/*-*.json; do
  "$snap" --screen "$f" --check --out "shots/stress/$(basename "$f" .json)"
done
"""
