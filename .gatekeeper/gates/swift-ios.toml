about = "every Swift library target builds for the iOS simulator, so an #if os(iOS) branch cannot break unseen"
fix = "fix the error the iOS build names; qualify a SwiftUI type the generated Blocks types shadow (SwiftUI.Gesture)"
budget_secs = 900
leg = "apple"
paths = ["Package.swift", "swift/**", ".gatekeeper/gates/swift-ios.toml"]
needs = ["quiet-host"]
run = """
set -e
sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
for t in Blocks BlocksUI BlocksSnapshot; do
  BLOCKS_STRICT=1 swift build --target "$t" --triple arm64-apple-ios26.0-simulator --sdk "$sdk"
done
"""
