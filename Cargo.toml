[workspace]
members = ["crates/*", "site"]
resolver = "2"

[workspace.package]
version = "2.2.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/jirathip-dev/blocks"
homepage = "https://github.com/jirathip-dev/blocks/blob/main/docs/consume.md"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
format_push_string = "allow"
format_collect = "allow"
many_single_char_names = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
cast_precision_loss = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes_without_reason = "deny"
let_underscore_must_use = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
egui = "0.37"                  # blocks-desk adds `features = ["default_fonts"]`; blocks-desktop adds none
icu_segmenter = { version = "2.4", default-features = false, features = ["compiled_data"] }   # blocks-desktop only
unicode-bidi = "0.3"           # blocks-desktop only
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
