name: swift
on:
  push:
    branches: [main, staging]
    paths: ["Package.swift", "swift/**", "schema/sample.json", "fixtures/screens/**", "fixtures/blocks/**", "fixtures/trees/**", "fixtures/protocol/**", "fixtures/behave/**", "fixtures/sim/**", ".github/workflows/swift.yml"]
  pull_request:
    paths: ["Package.swift", "swift/**", "schema/sample.json", "fixtures/screens/**", "fixtures/blocks/**", "fixtures/trees/**", "fixtures/protocol/**", "fixtures/behave/**", "fixtures/sim/**", ".github/workflows/swift.yml"]

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: "the Swift package: op apply, the generated types, a render test per core kind"
        env:
          BLOCKS_STRICT: "1"
        run: swift test
      - name: "blocks-snap --check on every fixtures/blocks file against its fixtures/trees/swift tree"
        env:
          BLOCKS_STRICT: "1"
        run: |
          swift build --product blocks-snap
          snap="$(swift build --show-bin-path)/blocks-snap"
          for f in fixtures/blocks/*.json; do
            k=$(basename "$f" .json)
            "$snap" --screen "$f" --expect "fixtures/trees/swift/$k.json" --check --out "shots/swift/$k"
          done
