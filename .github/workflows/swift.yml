name: swift
on:
  push:
    branches: [main, staging]
    paths: ["Package.swift", "swift/**", "schema/sample.json", "fixtures/screens/**", ".github/workflows/swift.yml"]
  pull_request:
    paths: ["Package.swift", "swift/**", "schema/sample.json", "fixtures/screens/**", ".github/workflows/swift.yml"]

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: "the Swift package: op apply, the generated types, a render test per core kind"
        env:
          BLOCKS_STRICT: "1"
        run: swift test
