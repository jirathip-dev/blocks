name: bench
on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: "bench/ builds (its servers, React bundle and runner); the numbers are docs/bench.md's, never a gate"
        run: just bench-build
