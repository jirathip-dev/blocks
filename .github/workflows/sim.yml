name: sim
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: "2000 random seeds from a nightly offset: the ops protocol, then one corpus through Rust, TS and Swift (a failure prints its seed; add it to SEEDS or fixtures/behave with the fix)"
        run: |
          day=$(( $(date +%s) / 86400 ))
          BLOCKS_SIM_FROM=$(( day * 2000 )) just sim 2000
