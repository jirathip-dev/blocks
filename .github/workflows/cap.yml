name: cap

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  line-cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: "line cap (ci/cap.toml; .drover/rules.md at most 30 lines)"
        run: just cap
