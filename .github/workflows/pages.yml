name: pages
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: "build the showcase site (every page a blocks Screen; a broken page fails here)"
        run: cargo run -q --locked -p blocks-site -- _site
      - name: "Playwright's WebKit"
        run: npm --prefix web ci --no-audit --no-fund && npx --prefix web playwright install --with-deps webkit
      - name: "same PNG and tree before and after blocks.js, links and the look sheet under /blocks/"
        run: cd web && SITE="$GITHUB_WORKSPACE/_site" node --no-warnings --test test/pages/showcase.test.ts
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
