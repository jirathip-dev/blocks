name: pages
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            demo/egui
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: "build the showcase site (every page a blocks Screen; a broken page fails here)"
        run: cargo run -q --locked -p blocks-site -- _site
      - name: "the egui demo to wasm, at /egui/ beside the HTML showcase"
        working-directory: demo/egui
        run: trunk build --release --locked --public-url /blocks/egui/ --dist "$GITHUB_WORKSPACE/_site/egui" && test -s "$GITHUB_WORKSPACE/_site/egui/index.html"
      - name: "Playwright's WebKit"
        run: npm --prefix web ci --no-audit --no-fund && npx --prefix web playwright install --with-deps webkit
      - name: "same PNG and tree before and after blocks.js, links and the look sheet under /blocks/"
        run: cd web && SITE="$GITHUB_WORKSPACE/_site" SHOTS="$GITHUB_WORKSPACE/shots" node --no-warnings --test test/pages/showcase.test.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playground-webkit-390-1440
          path: shots
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
