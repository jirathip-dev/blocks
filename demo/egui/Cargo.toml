[package]
name = "blocks-egui-demo"
description = "Every core kind's sample drawn by blocks-desktop, in a window and in the browser"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
blocks = { path = "../../crates/blocks" }
blocks-desktop = { path = "../../crates/blocks-desktop" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
