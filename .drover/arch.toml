frozen = [
    "ci/cap.toml",
    "crates/blocks/src/site/views.rs",
    "docs/schema.md",
    "swift/Sources/BlocksUI/Blocks.swift",
    "swift/Sources/BlocksUI/BlockCards.swift",
    "swift/Sources/BlocksUI/BlockLeaves.swift",
    "web/src/blocks.css",
    "web/src/render/index.ts",
    "web/test/render.test.ts",
]
generated = [
    "schema/blocks.schema.json",
    "schema/sample.json",
    "web/src/gen/types.ts",
    "web/src/gen/hooks.ts",
    "web/src/gen/sample.ts",
    "swift/Sources/Blocks/Gen/Blocks.swift",
    "web/src/gen/schemes.ts",
    "swift/Sources/Blocks/Gen/Schemes.swift",
    "swift/Sources/Blocks/Gen/Style.swift",
    "swift/Sources/Blocks/Gen/LayoutShapes.swift",
    "web/src/gen/layout.ts",
    "web/src/gen/kinds.ts",
    "web/src/gen/builders.ts",
    "web/src/gen/shapes.ts",
    "fixtures/check/*.json",
    "fixtures/built/*.json",
    "web/dist/blocks.js",
    "web/dist/blocks.css",
    "web/dist/core.js",
    "web/src/gen/scoped.css",
    "web/dist/blocks.scoped.css",
    "web/dist/types/**",
    "web/react/src/gen/views.ts",
    "web/dist/react.js",
    "fixtures/trees/react/*.json",
    "fixtures/blocks/*.json",
    "fixtures/trees/*.json",
    "fixtures/trees/swift/*.json",
    "fixtures/html/*.html",
    "fixtures/site/*.html",
    "fixtures/protocol/sim-*.json",
    "fixtures/behave/sim.json",
    "fixtures/gesture/sim.json",
    "fixtures/css/*.css",
    "crates/blocks/src/guard/rules/mod.rs",
    "skill/blocks/**",
    "crates/blocks-cli/src/gen/skill.rs",
]
generate = "just gen"
shared = [
    "crates/blocks/src/lib.rs",
    "crates/*/tests/support/**",
    "crates/blocks/src/codegen/mod.rs",
    "crates/blocks/tests/sim.rs",
    "web/src/patch.ts",
    "web/test/patch.test.ts",
    "web/test/dom.ts",
    "web/shot/shot.ts",
    ".drover/arch.toml",
    "justfile",
    "README.md",
    "crates/blocks/src/site/mod.rs",
    "crates/blocks/src/site/kind/mod.rs",
    "crates/blocks/tests/site.rs",
]

[[collect]]
dir = "ci/cap.d"
glob = "*.toml"

[[collect]]
dir = "crates/blocks/src/guard/rules"
glob = "*.rs"

[[collect]]
dir = "docs"
glob = "*.md"

[[collect]]
dir = "web/shot/probe"
glob = "*.ts"

[[collect]]
dir = "docs/schema"
glob = "*.md"

[[collect]]
dir = "web/src/render/kind"
glob = "*.ts"

[[collect]]
dir = "web/test/kind"
glob = "*.test.ts"

[[collect]]
dir = "swift/Sources/BlocksUI/Kind"
glob = "*.swift"

[[collect]]
dir = "web/src/css"
glob = "**/*.css"

[[collect]]
dir = "crates/blocks/src/site/kind"
glob = "*.rs"

[[collect]]
dir = "crates/blocks/tests"
glob = "site_*.rs"

[comments]
policy = "strict"
except = ["ci/lint-fixtures/**", "web/lint-fixtures/**"]

[docs]
paths = ["docs/*.md", "docs/schema/*.md", "README.md"]
skip = [".drover/**"]

[[layer]]
name = "expr"
paths = ["crates/blocks/src/expr.rs"]
mods = ["crate::expr", "blocks::expr"]

[[layer]]
name = "gesture"
paths = ["crates/blocks/src/gesture.rs"]
mods = ["crate::gesture", "blocks::gesture"]

[[layer]]
name = "kind"
paths = ["crates/blocks/src/kind/**"]
mods = ["crate::kind"]
may_use = ["expr", "gesture"]

[[layer]]
name = "built"
paths = ["crates/blocks/src/built.rs"]
mods = ["crate::built"]
may_use = ["kind", "gesture"]

[[layer]]
name = "wire"
paths = ["crates/blocks/src/wire.rs"]
mods = ["crate::wire", "blocks::wire"]
may_use = ["kind"]

[[layer]]
name = "patch"
paths = ["crates/blocks/src/patch.rs"]
mods = ["crate::patch"]
may_use = ["kind", "wire"]

[[layer]]
name = "diff"
paths = ["crates/blocks/src/diff.rs"]
mods = ["crate::diff"]
may_use = ["kind", "wire", "patch"]

[[layer]]
name = "shelf"
paths = ["crates/blocks/src/shelf.rs"]
mods = ["crate::shelf"]
may_use = ["kind", "wire", "diff", "patch"]

[[layer]]
name = "mirror"
paths = ["crates/blocks/src/mirror.rs"]
mods = ["crate::mirror"]
may_use = ["kind", "wire", "patch"]

[[layer]]
name = "behave"
paths = ["crates/blocks/src/behave.rs"]
mods = ["crate::behave", "blocks::behave"]
may_use = ["expr", "kind", "built", "gesture"]

[[layer]]
name = "tree"
paths = ["crates/blocks/src/tree.rs"]
mods = ["crate::tree", "blocks::tree"]
may_use = ["expr", "kind", "built", "behave", "wire"]

[[layer]]
name = "site"
paths = ["crates/blocks/src/site/**"]
mods = ["crate::site", "blocks::site"]
may_use = ["kind", "built", "behave", "tree", "theme"]

[[layer]]
name = "theme"
paths = ["crates/blocks/src/theme/**"]
mods = ["crate::theme"]

[[layer]]
name = "layout"
paths = ["crates/blocks/src/layout.rs"]
mods = ["crate::layout", "blocks::layout"]

[[layer]]
name = "web"
paths = ["crates/blocks/src/web.rs"]
mods = ["crate::web", "blocks::web"]

[[layer]]
name = "guard"
paths = ["crates/blocks/src/guard/**"]
mods = ["crate::guard", "blocks::guard"]
may_use = ["expr", "kind", "built", "behave", "tree", "wire", "patch"]

[[layer]]
name = "codegen"
paths = ["crates/blocks/src/codegen/**", "crates/blocks/src/bin/**"]
mods = ["crate::codegen", "blocks::codegen"]
may_use = ["expr", "kind", "built", "wire", "patch", "diff", "shelf", "mirror", "theme", "layout", "behave", "tree", "site", "guard", "gesture"]

[[layer]]
name = "cli"
paths = ["crates/blocks-cli/src/**"]
mods = ["blocks_cli"]
may_use = ["guard", "kind", "built", "tree", "wire"]

[[layer]]
name = "desktop-look"
paths = ["crates/blocks-desktop/src/look.rs", "crates/blocks-desktop/src/art.rs", "crates/blocks-desktop/src/text.rs"]
mods = ["crate::look", "crate::art", "crate::text"]

[[layer]]
name = "desktop-cx"
paths = ["crates/blocks-desktop/src/cx.rs", "crates/blocks-desktop/src/drawn.rs", "crates/blocks-desktop/src/act.rs", "crates/blocks-desktop/src/fallback.rs", "crates/blocks-desktop/src/island.rs", "crates/blocks-desktop/src/draw.rs"]
mods = ["crate::cx", "crate::drawn", "crate::act", "crate::fallback", "crate::island", "crate::draw"]
may_use = ["desktop-look", "tree"]

[[layer]]
name = "desktop-draw"
paths = ["crates/blocks-desktop/src/draw/**"]
mods = []
may_use = ["desktop-look", "desktop-cx"]

[[layer]]
name = "desktop-stage"
paths = ["crates/blocks-desktop/src/stage.rs", "crates/blocks-desktop/src/lib.rs"]
mods = ["crate::stage", "blocks_desktop"]
may_use = ["desktop-look", "desktop-cx", "expr", "behave", "tree"]

[[layer]]
name = "desk"
paths = ["crates/blocks-desk/src/**"]
mods = ["blocks_desk"]
may_use = ["desktop-stage", "expr", "tree"]

[[ban]]
pattern = "drover"
paths = ["Cargo.toml", "crates/*/Cargo.toml", "crates/*/src/**", "web/src/**", "swift/Sources/**"]
reason = "drover depends on blocks, never the other way: no drover import or type here"
comments = true
ignore_case = true

[[ban]]
pattern = "bench/"
paths = ["Cargo.toml", "crates/*/Cargo.toml", "crates/*/src/**", "web/src/**", "web/package.json", "swift/Sources/**", "Package.swift"]
reason = "bench/ is dev only (React, topcoat and the bench servers): the crate, the bundle and the Swift package never import it"
comments = true

[[ban]]
pattern = "import SwiftUI"
paths = ["swift/Sources/Blocks/**"]
reason = "Blocks is Foundation only: the views live in BlocksUI"

[[ban]]
pattern = "json!"
paths = ["crates/*/src/**"]
reason = "q2063: no hand-written JSON; build the typed value and serialize it"

[[ban]]
pattern = "tokio"
paths = ["Cargo.toml", "crates/*/Cargo.toml", "crates/*/src/**"]
reason = "no transport here: streams are carried by drover and cooee"
comments = true

[[ban]]
pattern = "std::net"
paths = ["crates/*/src/**"]
reason = "no transport here: streams are carried by drover and cooee"

[[ban]]
pattern = "std::process"
paths = ["crates/*/src/**"]
except = ["crates/blocks-cli/src/**"]
reason = "the library is pure: it starts no process"

[[ban]]
pattern = "std::fs"
paths = ["crates/*/src/**"]
except = ["crates/blocks/src/codegen/**", "crates/blocks-desk/src/main.rs", "crates/blocks-cli/src/**"]
reason = "the library is pure: only codegen and the command write files"

[[ban]]
pattern = "Instant::now"
paths = ["crates/*/src/**"]
except = ["crates/blocks-desk/src/stopwatch.rs", "crates/blocks-cli/src/**"]
reason = "the library is pure: no clock; time is the caller's"

[[ban]]
pattern = "SystemTime::now"
paths = ["crates/*/src/**"]
except = ["crates/blocks-cli/src/**"]
reason = "the library is pure: no clock; time is the caller's"

[[ban]]
pattern = "egui"
paths = ["crates/blocks/Cargo.toml", "crates/blocks/src/**", "site/Cargo.toml", "site/src/**"]
reason = "the blocks crate links no toolkit: egui is the desktop renderer's alone"

[[ban]]
pattern = "eframe"
paths = ["Cargo.toml", "crates/*/Cargo.toml", "crates/*/src/**"]
reason = "the window is the app's: the desktop renderer draws into the Ui it is handed"

[[ban]]
pattern = "winit"
paths = ["Cargo.toml", "crates/*/Cargo.toml", "crates/*/src/**"]
reason = "the window is the app's: the desktop renderer draws into the Ui it is handed"

[[ban]]
pattern = "wgpu"
paths = ["Cargo.toml", "crates/*/Cargo.toml", "crates/*/src/**"]
reason = "the harness draws on the CPU: no GPU crate here"

[[ban]]
pattern = "fetch("
paths = ["web/src/patch.ts"]
reason = "the patcher draws what it is handed; the stream does the network"

[[ban]]
pattern = "fetch("
paths = ["web/src/render/**"]
reason = "a renderer draws one block from what it is handed; the shell and the stream do the network"

[[ban]]
pattern = "gen/kinds.ts"
paths = ["web/src/render/kind/**"]
reason = "a kind draws one block; only block.ts reads the table of kinds"

[[ban]]
pattern = "localStorage"
paths = ["web/src/render/**"]
reason = "a renderer keeps drafts through the Ctx's store; the shell owns the storage"

[[ban]]
pattern = "new EventSource"
paths = ["web/src/**"]
except = ["web/src/stream.ts"]
reason = "one stream per device, opened by stream.ts"

[[ban]]
pattern = "document."
paths = ["web/src/stream.ts"]
reason = "the stream touches no DOM; the patcher does"

[[ban]]
pattern = "document."
paths = ["web/src/core/**"]
reason = "the core is framework-neutral: it computes, a renderer draws"

[[ban]]
pattern = "render/"
paths = ["web/src/core/**"]
reason = "the core never imports a renderer; renderers and adapters import the core"

[[ban]]
pattern = "from \"react"
paths = ["web/src/**", "web/shot/shot.ts"]
reason = "React lives in web/react and its harness boot only"

[[ban]]
pattern = "/render/"
paths = ["web/react/src/**"]
reason = "the adapter draws with React: it never hosts or imports the HTML renderer"

[[ban]]
pattern = "react-dom"
paths = ["web/react/src/**"]
reason = "the adapter imports react only; react-dom is the harness's and the app's"

[[ban]]
pattern = "@tanstack"
paths = ["web/src/**", "web/react/**", "web/shot/**"]
reason = "blocks imports no router and no query library: the app passes its own in"

[[ban]]
pattern = "dangerouslySetInnerHTML"
paths = ["web/react/**"]
reason = "no raw HTML in React either: markdown is drawn as elements"

[[ban]]
pattern = "setPointerCapture"
paths = ["web/src/**"]
except = ["web/src/gesture.ts"]
reason = "a drag goes through gesture.ts, which runs the one gesture machine: no view writes its own"

[[ban]]
pattern = ".draggable("
paths = ["swift/Sources/BlocksUI/**"]
reason = "a drag goes through Gestured.swift, which runs the one gesture machine: no view writes its own"

[[ban]]
pattern = "DragGesture("
paths = ["swift/Sources/BlocksUI/**"]
except = ["swift/Sources/BlocksUI/Gestured.swift", "swift/Sources/BlocksUI/BlockActs.swift"]
reason = "a drag goes through Gestured.swift; BlockActs.swift's is a row's swipe, which opens its buttons"

[[ban]]
pattern = "MagnifyGesture("
paths = ["swift/Sources/BlocksUI/**"]
except = ["swift/Sources/BlocksUI/Gestured.swift"]
reason = "one pinch zoom, in Gestured.swift: pages, marks and the image viewer share it"

[[ban]]
pattern = "setTimeout"
paths = ["web/src/core/gesture.ts", "web/src/core/kind/**"]
reason = "the gesture machine and a kind's rules have no clock: the driver owns the one touch hold"

[[size]]
paths = ["crates/*/src/**/*.rs"]
max_file_lines = 1000
max_fn_lines = 80

[[size]]
paths = ["crates/*/tests/**/*.rs"]
max_file_lines = 1000

[[size]]
paths = ["web/src/**/*.ts", "web/shot/**/*.ts", "web/react/src/**/*.ts"]
exclude = ["web/src/gen/**", "web/react/src/gen/**"]
max_file_lines = 500
max_fn_lines = 80

[[size]]
paths = ["web/test/**/*.ts"]
max_file_lines = 1000

[[size]]
paths = ["swift/Sources/**/*.swift"]
exclude = ["swift/Sources/**/Gen/**"]
max_file_lines = 500
max_fn_lines = 80

[[size]]
paths = ["swift/Tests/**/*.swift"]
max_file_lines = 1000

[[size]]
paths = ["web/src/patch.ts", "web/test/patch.test.ts", "web/test/dom.ts", "web/shot/shot.ts", "crates/blocks/tests/site.rs"]
max_file_lines = 200

[[size]]
paths = ["crates/blocks/tests/sim.rs"]
max_file_lines = 520

[[size]]
paths = [".drover/arch.toml", "justfile"]
max_file_lines = 300

[[size]]
paths = ["README.md"]
max_file_lines = 70

[[size]]
paths = ["crates/blocks/src/codegen/mod.rs", "crates/blocks/src/site/mod.rs", "crates/blocks/src/site/kind/mod.rs"]
max_file_lines = 80
