[package]
name = "blocks-bench"
description = "The 200-row bench's servers: blocks on Shelf, and topcoat with a shard"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
blocks = { path = "../crates/blocks" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
topcoat = { version = "=0.11.0", default-features = false, features = ["asset", "discover", "router", "runtime", "serve", "view"] }
topcoat-cli = "=0.11.0"

[[bin]]
name = "blocks-bench"
path = "src/bin/blocks.rs"

[[bin]]
name = "topcoat-bench"
path = "src/bin/topcoat.rs"

[[bin]]
name = "topcoat"
path = "src/bin/topcoat_cli.rs"
