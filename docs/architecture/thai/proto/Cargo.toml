[package]
name = "thai-proto"
description = "Architect #306: Thai word breaks fed into egui 0.37's own wrapping, measured before it is built"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
egui = { version = "0.37", features = ["default_fonts"] }
icu_segmenter = "2.4"

[profile.release]
lto = "thin"
codegen-units = 1
