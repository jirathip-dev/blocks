[package]
name = "min-gpui"
description = "Spike #299: the smallest GPUI window app, for binary size and the dependency tree"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }

[profile.release]
lto = "thin"
codegen-units = 1
