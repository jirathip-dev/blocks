<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>rounds: every state of a round and its row</title>
<link rel="stylesheet" href="../../../web/src/blocks.css"><link rel="stylesheet" href="rounds.css"><link rel="stylesheet" href="page.css">
<script src="rounds.js"></script></head>
<body><main class="scr">
<div class="tile"><div class="tabh"><span class="tw">rounds · states</span></div></div>
<div class="cases" id="cases"></div>
</main>
<script>
const R = (name, state, summary, extra = {}) => ({ id: name, name, state, summary, since: "5m", ...extra });
const cases = [
  ["1 · markers and tones", "A square marker per round on a 1px rail, 8px; the current (last) round's is 12px. Green: done, merged. Red: fail, needs. Ochre: working. Grey: idle. The summary takes the same tone as text.", [
    [{ id: "a", title: "every state", rounds: [R("idle", "idle", "not started"), R("done", "done", "pushed 4f1c2e0"), R("merged", "merged", "into staging"), R("fail", "fail", "FAIL · 2 blocking"), R("needs", "needs", "waits on you"), R("working", "working", "running")] }, true]]],
  ["2 · folded and open", "A row with rounds is a fold: a tap toggles it, and its chevron turns. Folded, it is today's row plus the chevron. Open, the subtitle hides (the rounds say it). It opens by itself when the last round needs you.", [
    [{ id: "b", title: "#12 folded", subtitle: "review 2 · PASS", value: "ready", rounds: [R("review 1", "fail", "FAIL"), R("review 2", "done", "PASS")] }],
    [{ id: "c", title: "#23 open by itself", subtitle: "hidden while open", value: "fix(3)", rounds: [R("review 2", "fail", "FAIL"), R("review 3", "needs", "round limit reached", { links: [{ label: "one more round" }, { label: "park" }] })] }]]],
  ["3 · a past round's tap", "A past round with a tap is a button (or a link for a url) with a chevron; one without a tap is plain text. The current round's line never taps: its body holds the actions.", [
    [{ id: "d", title: "#7 taps", rounds: [R("review 1", "fail", "FAIL · tap opens the verdict", { tap: { sheet: "/v/1" } }), R("fix 1", "done", "no tap"), R("review 2", "working", "the current round")] }, true]]],
  ["4 · the current round's body", "Only the last round draws a body, in order: its lane (name · harness · model · host, then its lines in mono; a working round's last line is live in ochre), its blocks, its links as buttons. A body with none of them is not drawn. A needs round's body gets a 3px red edge marker, never a red border.", [
    [{ id: "e", title: "lane only", rounds: [R("impl", "working", "writing", { lane: { name: "blocks-impl-44", harness: "claude", host: "mini", lines: ["web/src/render/row.ts +38", "running just test"] } })] }, true],
    [{ id: "f", title: "nothing to show", rounds: [R("impl", "done", "pushed 1d2e3f4"), R("review 1", "idle", "queued")] }, true]]],
  ["5 · long text", "Name and summary are one line each and end in \"…\"; the name keeps at least 40% of the line, the time never shrinks. Lane lines end in \"…\" too, never wrap.", [
    [{ id: "g", title: "#99 a long issue title that does not fit on a phone line", subtitle: "x", rounds: [
      R("review round number twelve", "fail", "FAIL · three blocking findings in the renderer and its tests", { since: "3d" }),
      R("fix 12", "working", "rebasing onto the integration branch after the cap raise", { lane: { name: "blocks-fix-99-r12", harness: "claude", model: "opus", host: "mini", lines: ["error[E0599]: no method named `rounds` found for struct `Row` in the current scope"] } })] }, true]]],
  ["6 · no rounds", "A row with no rounds, or an empty list, is drawn exactly as today: no chevron, no fold, its own tap. The goldens stay equal.", [
    [{ id: "h", title: "#61 frame budget", badge: { text: "merged", tone: "done" }, subtitle: "no rounds", value: "1d" }],
    [{ id: "i", title: "#62 empty list", subtitle: "rounds: []", value: "2d", rounds: [] }]]],
];
const box = document.getElementById("cases");
for (const [head, note, rs] of cases)
  box.append(h("div", "tile", h("div", "sh", h("b", null, head)), h("p", "note", note), ...rs.map(([b, f]) => row(b, f))));
document.body.dataset.h = Math.ceil(document.documentElement.scrollHeight);
</script></body></html>
