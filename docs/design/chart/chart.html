<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>chart: a sales dashboard</title>
<link rel="stylesheet" href="../../../web/src/blocks.css"><link rel="stylesheet" href="page.css"><link rel="stylesheet" href="chart.css">
<script src="chart.js"></script></head>
<body><main id="page">
<div class="top"><b>Sales</b><span class="m">FY 2567 · Oct 2566 – Sep 2567 · Buddhist Era</span></div>
<div class="stats"><div class="st"><b>฿14.2M</b><span class="m">revenue</span></div><div class="st"><b>3,184</b><span class="m">orders</span></div><div class="st"><b>31.4%</b><span class="m">gross margin</span></div></div>
<div id="combo"></div><div id="stacked" class="half"></div><div id="donut" class="half"></div><div id="line" class="half"></div><div id="bar" class="half"></div>
</main>
<script>
const fy = ["2023-10","2023-11","2023-12","2024-01","2024-02","2024-03","2024-04","2024-05","2024-06","2024-07","2024-08","2024-09"];
const M = a => a.map(v => v * 1e5);
const blocks = {
  combo: { type: "chart", id: "rev", chart: "combo", title: "Revenue and target", x: fy, era: "be", format: "thb_m", selected: "2024-03",
    series: [{ name: "Revenue", values: M([9.2,10.4,14.8,11.1,10.6,12.9,11.8,12.2,11.4,12.6,13.1,11.9]) },
             { name: "Target", as: "line", tone: "warn", values: M([10,10,13,11,11,12,12,12,12,12.5,12.5,12.5]) }],
    tap: { action: "sales.month" } },
  stacked: { type: "chart", id: "chan", chart: "stacked", title: "Revenue by channel", x: fy, era: "be", format: "thb_m",
    series: [{ name: "Store", values: M([5.1,5.6,7.9,6.0,5.8,6.6,6.1,6.3,5.7,6.2,6.4,5.8]) },
             { name: "Online", values: M([2.6,3.1,4.6,3.4,3.2,4.2,3.9,4.1,3.9,4.4,4.6,4.3]) },
             { name: "Wholesale", values: M([1.5,1.7,2.3,1.7,1.6,2.1,1.8,1.8,1.8,2.0,2.1,1.8]) }] },
  donut: { type: "chart", id: "spend", chart: "donut", title: "Spend by category", format: "thb",
    x: ["Payroll","Stock","Rent","Marketing","Delivery","Software","Utilities"], series: [{ name: "Spend", values: [3820000,2950000,1200000,640000,410000,180000,150000] }] },
  line: { type: "chart", id: "margin", chart: "line", title: "Gross margin", x: fy, era: "be", format: "percent",
    series: [{ name: "FY 2567", values: [28.1,29.4,33.0,30.2,30.8,31.9,31.1,32.4,31.6,32.8,33.5,31.4] },
             { name: "FY 2566", tone: "mute", dash: true, values: [26.0,27.2,30.1,28.4,28.0,29.6,29.0,29.9,29.1,30.2,30.8,29.7] }] },
  bar: { type: "chart", id: "orders", chart: "bar", title: "ยอดสั่งซื้อรายเดือน", lang: "th", x: fy, era: "be", format: "count",
    series: [{ name: "คำสั่งซื้อ", tone: "info", values: [214,236,341,262,248,291,270,279,262,288,301,192] }] },
};
for (const id in blocks) { const t = document.getElementById(id), c = chart(blocks[id]); c.className += " " + t.className; t.replaceWith(c); }
document.body.dataset.h = Math.ceil(document.documentElement.scrollHeight);
</script></body></html>
