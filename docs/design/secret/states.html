<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>secret: every state</title>
<link rel="stylesheet" href="../../../web/src/blocks.css"><link rel="stylesheet" href="secret.css"><link rel="stylesheet" href="page.css"></head>
<body><main class="scr">
<div class="tile"><div class="tabh"><span class="tw">secret · states</span></div></div>
<div class="cases" id="cases"></div>
</main>
<script>
const S = (o) => `<div class="secret b b-secret" data-block="secret"><label class="fd"><span class="fk">${o.label}${o.set ? '<span class="set">set ✓</span>' : ""}</span><input type="password" name="${o.name ?? "token"}" placeholder="${o.ph ?? ""}" value="${o.value ?? ""}" autocomplete="new-password" spellcheck="false"${o.focus ? ' style="outline:2px solid var(--l);outline-offset:-1px;border-color:var(--l)"' : ""}></label><div class="ra"><p class="m sn">sent to the app only, never to the agent</p><button type="button"${o.busy ? ' aria-busy="true"' : ""}><span>${o.busy ? "sending…" : "send"}</span></button></div></div>`;
const cases = [
  ["1 · empty", "`label` names the field; `placeholder` is the input's hint (none here). [send] on an empty field only focuses it, as the Swift view opens its editor.", S({ label: "API token" })],
  ["2 · with a placeholder", "The fixture plus `placeholder: \"sk-…\"`.", S({ label: "API token", ph: "sk-…" })],
  ["3 · typing", "Focused: a 2px ink ring. The value is a password field's dots, never shown, never saved as a draft, never offered to the browser's password store. Enter sends.", S({ label: "API token", value: "sk-live-4c9f1e", focus: true })],
  ["4 · sending", "The post is the block's `action` with `values` plus the typed value under `name`. [send] shows ↻ and says sending…; on success the field clears, on failure the value stays for another try.", S({ label: "API token", value: "sk-live-4c9f1e", busy: true })],
  ["5 · already set", "`set: true`: a moss-green \"set ✓\" after the label and the hint \"paste to replace\". The old value is never sent to the page.", S({ label: "GitHub token", set: true, ph: "paste to replace" })],
  ["6 · no label", "With no `label` the field is named by `name`, as on Swift.", S({ label: "OPENAI_API_KEY", name: "OPENAI_API_KEY" })],
];
const box = document.getElementById("cases");
for (const [head, note, html] of cases) {
  const t = document.createElement("div");
  t.className = "tile";
  t.innerHTML = `<div class=sh>${head}</div><div class=note>${note}</div>${html}`;
  box.append(t);
}
document.querySelectorAll(".tile").forEach((t, i) => t.style.setProperty("--i", i));
document.body.dataset.h = Math.ceil(document.documentElement.scrollHeight);
</script></body></html>
