<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>chart points: a sales plan</title>
<link rel="stylesheet" href="../neutral-default/tokens.css"><link rel="stylesheet" href="../../../web/dist/blocks.css"><link rel="stylesheet" href="points.css"><link rel="stylesheet" href="page.css">
<script src="../chart/chart.js"></script><script src="points.js"></script></head>
<body><main id="page">
<div class="top"><b>Sales plan</b><span class="m">FY 2568 · Oct 2567 – Sep 2568 · draft, editable until 31 Mar 2568</span></div>
<div id="rev"></div><div id="heads" class="half"></div><div id="margin" class="half"></div>
</main>
<script>
const fy = ["2024-10","2024-11","2024-12","2025-01","2025-02","2025-03","2025-04","2025-05","2025-06","2025-07","2025-08","2025-09"];
const M = (a) => a.map((v) => (v == null ? null : Math.round(v * 1e6)));
const rev = { type: "chart", id: "rev", chart: "combo", title: "Revenue plan", x: fy, era: "be", format: "thb_m",
  move: { action: "plan.target", name: "point" }, tap: { action: "plan.month" },
  series: [{ name: "Actual", fixed: true, values: M([1.02, 1.11, 1.46, 1.08, 1.04, 1.27, null, null, null, null, null, null]) },
           { name: "Target", as: "line", tone: "warn", step: 50000, values: M([1.0, 1.1, 1.4, 1.1, 1.1, 1.2, 1.2, 1.2, 1.25, 1.3, 1.3, 1.35]) }] };
const heads = { type: "chart", id: "heads", chart: "bar", title: "Headcount plan", x: fy, era: "be", format: "count",
  move: { action: "plan.heads", name: "point" },
  series: [{ name: "Staff", tone: "info", step: 1, values: [42, 42, 43, 44, 44, 45, 46, 46, 47, 48, 48, 50] }] };
const margin = { type: "chart", id: "margin", chart: "line", title: "Gross margin", x: fy, era: "be", format: "percent",
  series: [{ name: "FY 2568", values: [28.1, 29.4, 33.0, 30.2, 30.8, 31.9, null, null, null, null, null, null] },
           { name: "FY 2567", tone: "mute", dash: true, values: [26.0, 27.2, 30.1, 28.4, 28.0, 29.6, 29.0, 29.9, 29.1, 30.2, 30.8, 29.7] }] };
note(place("rev", points(rev, { grab: { series: 1, at: 7, to: 1350000, phase: "previewing", by: "pointer" } })),
  "Pointer drag on May 2568's Target point. Actual is <code>fixed</code>, so its bars have no handles. Every Target point shows a hollow handle; the grabbed one is filled and follows in steps of ฿50K. The axis holds still while dragging. Release sends one action: <code>plan.target {point: {series: \"Target\", at: \"2025-05\", y: 1350000}}</code>.");
note(place("heads", points(heads, { grab: { series: 0, at: 8, to: 49, phase: "previewing", by: "keys" } })),
  "Keyboard: Space grabbed June's bar, Up twice. The keys show under the plot while grabbed. Enter sends <code>plan.heads {point: {series: \"Staff\", at: \"2025-06\", y: 49}}</code>.");
note(place("margin", points(margin)),
  "No <code>move</code>: this chart takes no gestures. No handles; columns tap as in #132.");
document.body.dataset.h = Math.ceil(document.documentElement.scrollHeight);
</script></body></html>
