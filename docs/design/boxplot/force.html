<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>boxplot: grip force</title>
<link rel="stylesheet" href="../neutral-default/tokens.css"><link rel="stylesheet" href="../../../web/dist/blocks.css"><link rel="stylesheet" href="boxplot.css"><link rel="stylesheet" href="page.css"><script src="boxplot.js"></script></head>
<body><main id="page">
<div class="top"><b>Grip force</b><span class="m">Max hangs on the 20 mm edge · last 10 sessions · 214 reps</span></div>
<div id="hands" class="half"></div><div id="fingers" class="half"></div>
<div id="sessions"></div>
</main>
<script>
const B = (name, min, q1, median, q3, max, outliers, tone) => ({ name, min, q1, median, q3, max, outliers, tone });
const blocks = {
  hands: { type: "boxplot", id: "hands", title: "Peak force per hand", axis: "Peak force", unit: "kg", selected: "Left",
    boxes: [B("Left", 25.8, 30.4, 33.1, 36.0, 41.2, [18.0, 47.5]), B("Right", 28.2, 32.9, 35.6, 38.1, 43.0, [21.4])],
    tap: { action: "force.hand" } },
  fingers: { type: "boxplot", id: "fingers", title: "Force share per finger", axis: "Share of hand", unit: "%",
    boxes: [B("Index", 24.0, 27.5, 29.0, 30.5, 33.0, [20.5]), B("Middle", 29.0, 31.5, 33.0, 34.5, 37.5, []),
            B("Ring", 20.5, 23.0, 24.5, 26.0, 28.5, [31.5]), B("Little", 9.0, 11.5, 13.0, 14.0, 16.5, [5.5], "warn")] },
  sessions: { type: "boxplot", id: "sessions", title: "Peak force per session", axis: "Peak force, both hands", unit: "kg", selected: "18 Nov",
    boxes: [B("2 Oct", 24.1, 28.0, 30.2, 32.4, 36.9, [19.5]), B("6 Oct", 25.0, 28.8, 31.0, 33.1, 37.4, []),
            B("9 Oct", 25.6, 29.5, 31.4, 33.6, 38.0, [42.8]), B("13 Oct", 26.2, 30.1, 32.0, 34.2, 38.6, []),
            B("16 Oct", 22.0, 25.4, 27.1, 29.0, 32.8, [17.2, 18.4], "bad"), B("23 Oct", 26.8, 30.6, 32.9, 35.0, 39.5, []),
            B("30 Oct", 27.5, 31.2, 33.4, 35.7, 40.2, [45.1]), B("6 Nov", 28.0, 31.9, 34.0, 36.2, 40.8, []),
            B("13 Nov", 28.6, 32.5, 34.8, 37.0, 41.6, [22.9]), B("18 Nov", 29.1, 33.0, 35.2, 37.6, 42.3, [24.0, 48.6])],
    tap: { action: "force.session" } },
};
for (const id in blocks) { const t = document.getElementById(id), c = boxplot(blocks[id]); c.className += " " + t.className; t.replaceWith(c); }
document.body.dataset.h = Math.ceil(document.documentElement.scrollHeight);
</script></body></html>
