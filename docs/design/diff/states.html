<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>diff: every case</title>
<link rel="stylesheet" href="../../../web/src/blocks.css"><link rel="stylesheet" href="../neutral-default/tokens.css">
<link rel="stylesheet" href="page.css"><link rel="stylesheet" href="diff.css"><script src="diff.js"></script></head>
<body><main class="scr wide" id="page"><div class="cases" id="cases"></div></main>
<script>
const cases = [
  ["1 the fixture (fixtures/blocks/diff.json): file, no summary, one hunk", { type: "diff", id: "change", file: "src/lib.rs", hunks: [{ at: "@@ -1 +1 @@", lines: ["-a", "+b"] }] }],
  ["2 summary on the right; context lines muted, changed lines in ink with a 3px marker", { type: "diff", file: "crates/blocks/src/kind/mod.rs", summary: "+1 −1", hunks: [{ at: "@@ -240,6 +240,6 @@ kind! {", lines: ["     pub struct Diff {", "         id: Option<String>,", "-        file: String,", "+        file: Path,", "         summary: Option<String>,", "         hunks: Vec<Hunk>,"] }] }],
  ["3 several hunks: each @@ line in ink, a hairline between hunks", { type: "diff", file: "justfile", summary: "+2 −1", hunks: [{ at: "@@ -3,3 +3,4 @@ gen:", lines: ["     cargo run --features schema --bin codegen", "+    npm run build", "     swift build"] }, { at: "@@ -20,3 +21,3 @@ cap:", lines: [" ", "-    scripts/line-cap.sh 13000", "+    scripts/line-cap.sh 13500"] }] }],
  ["4 a long line: the code box scrolls sideways as one, the header stays; no wrapping", { type: "diff", file: "web/src/render/diagram.ts", summary: "+1 −1", hunks: [{ at: "@@ -9,2 +9,2 @@", lines: ["-const WIDE: Metrics = { cls: \"wide\", widths: [156, 176, 140], gap: 40, gutter: 18, height: 54, rowGap: 22 };", "+const WIDE: Metrics = { cls: \"wide\", widths: [156, 176, 140], gap: 40, gutter: 18, height: 54, rowGap: 24 };", " const PHONE: Metrics = { cls: \"phone\", widths: [108, 100, 78], gap: 22, gutter: 12, height: 46, rowGap: 20 };"] }] }],
  ["5 a long path wraps anywhere; the summary drops under it when there is no room", { type: "diff", file: "swift/Sources/BlocksUI/Components/Leaves/BlockEdits+DiffLine.swift", summary: "renamed · +0 −0", hunks: [{ at: "@@ -1,2 +1,2 @@", lines: [" import Blocks", " import SwiftUI"] }] }],
  ["6 a deleted file and a \"\\ No newline\" note (any other first character draws as context)", { type: "diff", file: "web/src/ops.ts", summary: "deleted · −3", hunks: [{ at: "@@ -1,3 +0,0 @@", lines: ["-export function ops(a, b) {", "-  return [];", "-}", "\\ No newline at end of file"] }] }],
  ["7 no hunks (a binary or mode-only change): the header alone, no empty box", { type: "diff", file: "docs/design/diff/diff-light-1440.png", summary: "binary", hunks: [] }],
];
const box = document.getElementById("cases");
for (const [label, b] of cases) {
  const d = document.createElement("div");
  const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = label;
  const tile = document.createElement("div"); tile.className = "tile"; tile.append(diff(b));
  d.append(cap, tile); box.append(d);
}
const fb = document.createElement("div");
const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = "8 a block that does not read as a diff (no file or no hunks list) draws its fallback row, as the gap does now";
const t = document.createElement("div"); t.className = "tile";
const r = document.createElement("div"); r.dataset.fallback = ""; r.innerText = ""; const row = document.createElement("div"); row.className = "row"; row.textContent = "diff"; r.append(row); t.append(r);
fb.append(cap, t); box.append(fb);
document.body.dataset.h = Math.ceil(document.documentElement.scrollHeight);
</script></body></html>
